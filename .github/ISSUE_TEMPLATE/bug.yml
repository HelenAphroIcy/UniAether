name: Something looks wrong · 哪里不对
description: A crystal that renders wrongly, an error, a browser that fails
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect? · 发生了什么，你以为会是什么样？
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: The options you passed · 用的参数
      render: js
  - type: input
    id: browser
    attributes:
      label: Browser and device · 浏览器和设备
